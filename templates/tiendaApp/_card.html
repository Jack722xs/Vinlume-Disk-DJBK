{% load static %}
<article class="card holo-card" role="listitem">
  <div class="card-image">
    <img src="{% static 'images/discos/'|add:disco.imagen %}" alt="{{ disco.artista.nombre }} - {{ disco.titulo }}" loading="lazy">
    <button type="button" class="fav-btn" aria-label="Añadir a favoritos" data-id="{{ disco.id }}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
    </button>
  </div>
  <div class="card-body">
    <h2>{{ disco.titulo }}</h2>
    <p class="artista">{{ disco.artista.nombre }}</p>
    <div class="tags">{% for tag in disco.lista_etiquetas %}<span class="tag">{{ tag }}</span>{% endfor %}</div>
    <div class="card-footer">
      <p class="precio">CLP {{ disco.precio|floatformat:"0g" }}</p>
      {% if disco.estado == 'a' %}<span class="tag agotado">Agotado</span>{% else %}<button type="button" class="btn buy-btn">Comprar</button>{% endif %}
    </div>
  </div>
</article>
