{% extends 'base.html' %}
{% block titulo %}Preguntas Frecuentes - Vinlume Disk{% endblock %}
{% block contenido %}
  <main>
    <section class="faq-section pagina-interna">
      <div class="section-content">
        <h1 class="section-title">Preguntas <span class="holo-text">Frecuentes</span></h1>
        <div class="faq-container">
          {% for item in preguntas %}
            <details class="faq-item">
              <summary>{{ item.pregunta }}</summary>
              <p>{{ item.respuesta }}</p>
            </details>
          {% endfor %}
        </div>
      </div>
    </section>
  </main>
{% endblock %}
